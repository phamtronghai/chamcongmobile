workflows:
  ios-testflight:
    name: iOS TestFlight
    # Tự chạy build khi push lên GitHub (nhánh main). Cần app Codemagic dùng codemagic.yaml + repo đã kết nối webhook.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    # Must match the App Store Connect API key name in Codemagic: Team → Integrations → Developer Portal.
    integrations:
      app_store_connect: ChamCong
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - chamcong_appstore_profile
        certificates:
          - ChamCong
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Install FlutterFire CLI (required by iOS build phase)
        script: |
          dart pub global activate flutterfire_cli
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Create export options (App Store)
        script: |
          cat > /tmp/export_options.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>SFB7XGV2NZ</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.pth.chamcong</key>
              <string>ChamCong</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
      - name: Build IPA
        script: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          flutter build ipa --release --export-options-plist=/tmp/export_options.plist \
            --obfuscate --split-debug-info=build/symbols
    artifacts:
      - build/ios/ipa/*.ipa
      - build/symbols/**
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
