name: attendancebyface
description: "Chấm công bằng khuôn mặt."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 2.3.0+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  http_parser: ^4.0.2
  path_provider: ^2.1.5
  geolocator: ^14.0.1
  intl: ^0.20.2
  camera: ^0.11.3
  smooth_page_indicator: ^2.0.1
  shared_preferences: ^2.5.3
  liquid_glass_navbar: ^1.0.4
  local_auth: ^3.0.0
  provider: ^6.1.5
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  dio: ^5.8.0+1
  adaptive_theme: ^3.6.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.2.0
  flutter_svg: ^2.0.10+1
  flutter_secure_storage: ^10.0.0
  safe_device: ^1.1.7
  maplibre_gl: ^0.24.1
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.0
  image_picker: ^1.1.2
  mobile_scanner: ^7.0.1
  package_info_plus: ^9.0.0
  go_router: ^17.0.1
  syncfusion_flutter_datepicker: ^31.1.23
  syncfusion_flutter_pdfviewer: ^31.1.23
  url_launcher: ^6.3.2
  device_info_plus: ^12.3.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  day_night_time_picker: ^1.3.1
  flutter_slidable: ^4.0.3
  syncfusion_localizations: ^31.2.18
  get_it: ^9.2.1
  # flutter_native_splash moved to dev_dependencies

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  build_runner: ^2.12.0
  flutter_gen_runner: ^5.14.1
  freezed: ^3.2.3
  json_annotation: ^4.9.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icon/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Overpass
      fonts:
        - asset: assets/overpass/Overpass-Regular.ttf
        - asset: assets/overpass/Overpass-Medium.ttf
          weight: 500
        - asset: assets/overpass/Overpass-SemiBold.ttf
          weight: 600
        - asset: assets/overpass/Overpass-Bold.ttf
          weight: 700
        - asset: assets/overpass/Overpass-Italic.ttf
          style: italic
    - family: OverpassMono
      fonts:
        - asset: assets/overpass/OverpassMono.ttf
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Cấu hình biểu tượng ứng dụng
flutter_gen:
  output: lib/gen/
  integrations:
    image: true
    flutter_svg: true

# Biểu tượng ứng dụng: bản vuông (launcher iOS/Android)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/Logo-AppChamCong.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true # Loại bỏ kênh alpha cho biểu tượng iOS

# Splash: logo bo tròn; màu nền khớp đỏ thương hiệu
flutter_native_splash:
  color: "#E53935"
  color_dark: "#C62828"
  image: assets/icon/Logo-AppChamCong-BoTron.png
  image_dark: assets/icon/Logo-AppChamCong-BoTron.png
  ios: true
